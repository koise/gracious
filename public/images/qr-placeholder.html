<!DOCTYPE html>
<html>
<head>
    <title>QR Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .qr-container {
            width: 200px;
            height: 200px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .qr-grid {
            width: 150px;
            height: 150px;
            background-color: white;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
        }
        .qr-cell {
            background-color: #222;
        }
        .qr-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #222;
        }
        .qr-corner::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            top: 5px;
            left: 5px;
        }
        .qr-corner::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #222;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
        .qr-corner-tl {
            top: 0;
            left: 0;
        }
        .qr-corner-tr {
            top: 0;
            right: 0;
        }
        .qr-corner-bl {
            bottom: 0;
            left: 0;
        }
        .qr-text {
            margin-top: 10px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-grid">
            <div class="qr-corner qr-corner-tl"></div>
            <div class="qr-corner qr-corner-tr"></div>
            <div class="qr-corner qr-corner-bl"></div>
            
            <!-- Random QR dots -->
            <div class="qr-cell" style="grid-row: 3; grid-column: 7;"></div>
            <div class="qr-cell" style="grid-row: 4; grid-column: 9;"></div>
            <div class="qr-cell" style="grid-row: 5; grid-column: 4;"></div>
            <div class="qr-cell" style="grid-row: 5; grid-column: 11;"></div>
            <div class="qr-cell" style="grid-row: 6; grid-column: 6;"></div>
            <div class="qr-cell" style="grid-row: 7; grid-column: 8;"></div>
            <div class="qr-cell" style="grid-row: 8; grid-column: 3;"></div>
            <div class="qr-cell" style="grid-row: 8; grid-column: 10;"></div>
            <div class="qr-cell" style="grid-row: 9; grid-column: 5;"></div>
            <div class="qr-cell" style="grid-row: 9; grid-column: 12;"></div>
            <div class="qr-cell" style="grid-row: 10; grid-column: 7;"></div>
            <div class="qr-cell" style="grid-row: 11; grid-column: 4;"></div>
            <div class="qr-cell" style="grid-row: 11; grid-column: 9;"></div>
            <div class="qr-cell" style="grid-row: 12; grid-column: 6;"></div>
            <div class="qr-cell" style="grid-row: 13; grid-column: 11;"></div>
        </div>
        <div class="qr-text">QR Code Placeholder</div>
    </div>
</body>
</html>
